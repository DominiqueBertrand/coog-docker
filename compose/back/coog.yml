services:
  coog:
    extends:
      file: compose/back/common.yml
      service: back-common
    command:
      - server
      - ${COOG_SERVER_WORKERS:?}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # No curl / wget in the image, but python3 is available
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status == 200 else 1)"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.replace_sao_route.stripprefix.prefixes=/sao
      - traefik.http.routers.coog.rule=Host(`${PROJECT_HOSTNAME:?}`) && ( PathPrefix(`/sao`) || PathPrefix(`/doc`) || PathPrefix(`/`))
      - traefik.http.routers.coog.entrypoints=http
      - traefik.http.routers.coog.middlewares=replace_sao_route@docker
      - traefik.http.routers.coog_s.rule=Host(`${PROJECT_HOSTNAME:?}`) && ( PathPrefix(`/sao`) || PathPrefix(`/doc`) || PathPrefix(`/`))
      - traefik.http.routers.coog_s.entrypoints=https
      - traefik.http.routers.coog_s.middlewares=replace_sao_route@docker
      - traefik.http.routers.coog_s.tls=true
    environment:
      - ENABLE_UWSGI_STATS=${COOG_UWSGI_STATS:?}
      - ENABLE_UWSGI_TRACEBACKER=${COOG_UWSGI_TRACEBACKER:?}
      - TRYTOND_OPENTELEMETRY__SERVICE_NAME=${OPEN_TELEMETRY_SERVICE_NAME_COOG:?}
      - TRYTOND_SESSION__JWT_ENCRYPTION=${JWT_ENCRYPTION:?}
      - TRYTOND_API__TRYPHENE_DEV_MODE=${ENABLE_TRYTOND_API__TRYPHENE_DEV_MODE:-false}
      - TRYTOND_DOCUMENT_API__TEMPORARY_UPLOAD_ROOT=${TRYTOND_DOCUMENT_API__TEMPORARY_UPLOAD_ROOT:-/workspace/io/tmp_upload}
    restart: always
